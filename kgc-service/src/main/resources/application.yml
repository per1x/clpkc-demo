server:
  port: 8443            # KGC 明文 HTTP 端口（TLS 由后续 NGINX 网关处理）
  shutdown: graceful

spring:
  application:
    name: kgc-service

clpkc:
  kgc:
    curve-name: secp256r1
    # ============================== 安全警告 ==============================
    # KGC 主私钥 s（32 字节大端 hex）。此处示例值仅用于本地联调，
    # 生产环境必须通过环境变量 CLPKC_KGC_MASTER_SECRET_HEX 或外部配置覆盖，
    # 且严禁提交真实主私钥到代码仓库。
    #   export CLPKC_KGC_MASTER_SECRET_HEX=<64位hex>
    # 留空则每次启动随机生成（仅开发用，重启即失效，会打印告警）。
    # ====================================================================
    master-secret-hex: ${CLPKC_KGC_MASTER_SECRET_HEX:00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff}

logging:
  level:
    root: INFO
    com.clpkc: INFO
