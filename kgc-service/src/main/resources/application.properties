server.port=${CLPKC_KGC_PORT:8443}
server.shutdown=graceful
spring.application.name=kgc-service

clpkc.kgc.curve-name=sm2p256v1
# KGC 主私钥 s（32 字节大端 hex，64 字符）。生产环境请用环境变量 CLPKC_KGC_MASTER_SECRET_HEX 覆盖，勿提交真实主私钥。
clpkc.kgc.master-secret-hex=${CLPKC_KGC_MASTER_SECRET_HEX:00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff}

logging.level.root=INFO
logging.level.com.clpkc=INFO
