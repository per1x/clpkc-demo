# 充电桩配置（key=value，# 为注释）。可用同名环境变量覆盖：
#   CLPKC_PILE_HOST_NO / CLPKC_CLOUD_HOST / CLPKC_CLOUD_PORT /
#   CLPKC_SHARED_KEY_HEX / CLPKC_CONNECT_TIMEOUT_MS / CLPKC_READ_TIMEOUT_MS /
#   CLPKC_KEYSTORE_PATH（默认相对路径 pile-keystore.json，随进程工作目录）

# 主机编号：≤14 位十进制数字串；BCD 成 7 字节后作 ID_B 前 7 字节，其余 25 字节补 0x00。
# 不足 14 位左侧补 '0'（保持数值不变）。
pile.host_no = 00000000000001
cloud.host = 127.0.0.1
cloud.port = 9000

# 与云平台的全局预共享密钥 = 16 字节 SM4 静态密钥（32 hex）。生产环境请通过环境变量注入，勿提交真实值。
shared.key.hex = 00112233445566778899aabbccddeeff

connect.timeout.ms = 3000
read.timeout.ms = 15000
