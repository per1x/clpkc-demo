server.port=8081
server.shutdown=graceful
spring.application.name=cloud-service

clpkc.cloud.id=cloud-001
# 云平台静态私钥（留空则随机生成并告警；生产环境固定）
clpkc.cloud.static-secret-hex=${CLPKC_CLOUD_STATIC_SECRET_HEX:}
# 与充电桩的全局预共享密钥 = 那把 16 字节 SM4 静态密钥（32 hex）。生产环境用环境变量覆盖。
clpkc.cloud.shared-key-hex=${CLPKC_CLOUD_SHARED_KEY_HEX:00112233445566778899aabbccddeeff}

clpkc.cloud.socket.port=9000
clpkc.cloud.socket.backlog=128
clpkc.cloud.socket.read-timeout-ms=15000
clpkc.cloud.socket.max-threads=64

clpkc.cloud.kgc.base-url=${CLPKC_KGC_BASE_URL:http://127.0.0.1:8443}
clpkc.cloud.kgc.connect-timeout-ms=3000
clpkc.cloud.kgc.read-timeout-ms=5000

logging.level.root=INFO
logging.level.com.clpkc=INFO
